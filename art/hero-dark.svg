<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" aria-labelledby="t d" role="img" viewBox="0 0 1200 400"><title id="t">AboutLibraries</title><desc id="d">AboutLibraries collects the dependencies and licenses of a Gradle project at build time and renders them with Compose. Three stages: build.gradle.kts, a generated aboutlibraries.json, and a LibrariesContainer showing license pills.</desc><rect width="1200" height="400" fill="#1A1A1A" rx="26"/><circle cx="70" cy="78" r="5" fill="#C7FF1E"/><text x="88" y="84" fill="#B4B4B4" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="19" letter-spacing="2.6">GRADLE PLUGIN · KOTLIN MULTIPLATFORM · COMPOSE UI</text><text x="64" y="166" fill="#FFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="68" font-weight="700">AboutLibraries</text><text x="64" y="212" fill="#B4B4B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="25">Collects every dependency and license of your Gradle project at build time,</text><text x="64" y="246" fill="#B4B4B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="25">then renders them with Compose — on Android, iOS, desktop, web and Wear.</text><rect width="325" height="88" x="64" y="280" fill="#232323" stroke="#3D4A16" rx="14"/><path fill="#C7FF1E" d="M65 294 a13 13 0 0 1 13 -13 h3 v86 h-3 a13 13 0 0 1 -13 -13 z"/><text x="94" y="318" fill="#D0D0D0" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="21">build.gradle.kts</text><text x="94" y="346" fill="#B4B4B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18">your Gradle dependencies</text><path fill="none" stroke="#333" stroke-width="2" d="M401 324 h26"/><path fill="none" stroke="#B4B4B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M423 319 l6 5 l-6 5"/><rect width="325" height="88" x="437" y="280" fill="#232323" stroke="#12482A" rx="14"/><path fill="#00FF6A" d="M438 294 a13 13 0 0 1 13 -13 h3 v86 h-3 a13 13 0 0 1 -13 -13 z"/><text x="467" y="318" fill="#D0D0D0" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="21">aboutlibraries.json</text><text x="467" y="346" fill="#B4B4B4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18">generated at build time</text><path fill="none" stroke="#333" stroke-width="2" d="M774 324 h26"/><path fill="none" stroke="#B4B4B4" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M796 319 l6 5 l-6 5"/><rect width="325" height="88" x="810" y="280" fill="#232323" stroke="#123C4D" rx="14"/><path fill="#00B9FF" d="M811 294 a13 13 0 0 1 13 -13 h3 v86 h-3 a13 13 0 0 1 -13 -13 z"/><text x="840" y="318" fill="#00B9FF" font-family="ui-monospace, SFMono-Regular, Menlo, 'Cascadia Mono', monospace" font-size="21">LibrariesContainer()</text><rect width="122" height="26" x="840" y="330" fill="#22331F" rx="13"/><text x="901" y="349" fill="#C7FF1E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" text-anchor="middle">Apache 2.0</text><rect width="67" height="26" x="972" y="330" fill="#22331F" rx="13"/><text x="1006" y="349" fill="#C7FF1E" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-size="18" font-weight="600" text-anchor="middle">MIT</text></svg>